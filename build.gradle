buildscript {
    ext {
        kotlinVersion = '2.0.0'
        retrofit_version = "2.9.0"
        okhttp_version = "5.0.0-alpha.6"
        coroutines_version = "1.6.4"
        rxAndroidVersion = '3.0.0'
        koin_version = '3.4.2'
    }

    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven { url "https://s01.oss.sonatype.org/content/repositories/releases/" }
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.8.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
        classpath "org.jetbrains.kotlin:kotlin-serialization:$kotlinVersion"
//        classpath 'com.google.gms:google-services:4.3.15'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.9.6'
    }
}

plugins {
    id 'com.android.application' version '8.8.2' apply false
    id 'com.android.library' version '8.8.2' apply false
    id 'org.jetbrains.kotlin.android' version '2.0.0' apply false
    id 'io.realm.kotlin' version '2.0.0' apply false
    //    id 'com.google.gms.google-services' version '4.3.15' apply false
    id 'com.google.firebase.crashlytics' version '2.9.4' apply false
    id("io.ktor.plugin") version "3.1.3" apply false
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.0.0' apply true
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
