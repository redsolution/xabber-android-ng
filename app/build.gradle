plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'kotlin-android'
    id 'io.realm.kotlin'
    id 'kotlin-parcelize'
    id 'com.google.gms.google-services'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    compileSdk 34

    defaultConfig {
        applicationId "com.xabber.android.beta"
        minSdk 23
        targetSdk 35
        versionCode 1100
        versionName "4.0.0(1100)"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        lintOptions {
            checkReleaseBuilds false
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    dataBinding {
        enabled true
    }

    buildFeatures {
        viewBinding true
    }

    buildToolsVersion '35.0.1'
    namespace 'com.xabber'
}


dependencies {
    api fileTree(dir: 'src/main/java', include: '*.jar')
    api files('src/main/java/opus.aar')

    // Android Support
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.legacy:legacy-support-v13:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.9.0'
    implementation "androidx.recyclerview:recyclerview:1.3.0"
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
    implementation "androidx.fragment:fragment-ktx:1.6.0"
    implementation 'androidx.preference:preference-ktx:1.2.0'

    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlinVersion"
    implementation 'androidx.navigation:navigation-runtime-ktx:2.8.6'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'org.minidns:minidns-core:1.1.1'
    implementation 'org.minidns:minidns-hla:1.1.1'
    implementation 'io.ktor:ktor-network:3.1.3'
    implementation 'org.jetbrains.kotlin.plugin.serialization:org.jetbrains.kotlin.plugin.serialization.gradle.plugin:2.2.0-RC'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-core-jvm:1.8.1'
    implementation 'io.viascom.nanoid:nanoid:1.0.1'


    // Test
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    //RxJava3
    implementation "io.reactivex.rxjava3:rxjava:3.1.5"
    implementation "io.reactivex.rxjava3:rxandroid:$rxAndroidVersion"
    implementation'io.reactivex.rxjava2:rxkotlin:2.4.0'

    // Retrofit
    implementation "com.squareup.retrofit2:retrofit:$retrofit_version"
    implementation "com.squareup.retrofit2:converter-gson:$retrofit_version"
    implementation "com.squareup.retrofit2:adapter-rxjava3:$retrofit_version"
    implementation "com.squareup.okhttp3:logging-interceptor:$okhttp_version"
    implementation "com.squareup.okhttp3:okhttp:$okhttp_version"
    implementation 'com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter:0.8.0'
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.4.0"

    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"

    // SlidingPaneLayout
    implementation 'androidx.slidingpanelayout:slidingpanelayout:1.2.0'

    // ViewBindingPropertyDelegate without reflection
    implementation "com.github.kirich1409:viewbindingpropertydelegate-noreflection:1.5.6"

    // Glide
    implementation 'com.github.bumptech.glide:glide:4.14.2'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.11.0'
    implementation 'jp.wasabeef:glide-transformations:4.3.0'

    //Di
    implementation "io.insert-koin:koin-core:$koin_version"
    implementation "io.insert-koin:koin-android:$koin_version"

// Realm
    implementation 'io.realm.kotlin:library-base:2.3.0'
    // If using Device Sync
    implementation 'io.realm.kotlin:library-sync:2.3.0'
    // If using coroutines with the SDK
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.0'

    //ktor

    implementation("io.ktor:ktor-client-android:3.1.3")
    implementation("io.ktor:ktor-client-core:3.1.3")
    implementation("io.ktor:ktor-client-serialization-jvm:3.1.3")
    implementation("io.ktor:ktor-client-logging:3.1.3")
    implementation("io.ktor:ktor-client-cio:3.1.3")
    implementation("io.ktor:ktor-client-okhttp:3.1.3")


    //weird
    implementation 'org.bouncycastle:bcprov-jdk15on:1.70' // For SCRAM-SHA-1


    //Stream
    implementation("io.github.pdvrieze.xmlutil:serialization:0.91.1")
    implementation("io.github.pdvrieze.xmlutil:core:0.91.1")
// Open street map
    implementation 'org.osmdroid:osmdroid-android:6.1.16'

    // QR code scanner
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.1'

    // Crop
    implementation 'com.github.CanHub:Android-Image-Cropper:4.3.2'

    // Debug
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.9.1'

    def emojiViewVersion = "1.5.2"
    def emojiViewProvider = "GoogleProvider"

    implementation "io.github.aghajari:AXEmojiView:$emojiViewVersion"
    implementation "io.github.aghajari:AXEmojiView-$emojiViewProvider:$emojiViewVersion"

    // PhotoView
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'

//     Crashlytics
    implementation platform('com.google.firebase:firebase-bom:31.2.3')
    implementation 'com.google.firebase:firebase-crashlytics-ktx'
    implementation 'com.google.firebase:firebase-analytics-ktx'

    // Firebase
//    implementation 'com.google.firebase:firebase-messaging-ktx:23.1.0'
//    implementation platform('com.google.firebase:firebase-bom:30.5.0')
//    implementation 'com.google.firebase:firebase-core:21.1.1'
//    implementation 'com.google.firebase:firebase-analytics'
//    implementation 'com.google.firebase:firebase-messaging'
}
